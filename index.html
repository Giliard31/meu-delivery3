<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Topo / Cabeçalho -->
  <header>
    <h1>🍔 Nosso Delivery</h1>
    <div id="auth-buttons">
      <button id="btn-login-open" onclick="abrirModalLogin()">Entrar</button>
      <div id="user-info" style="display:none;">
        <span id="user-name"></span>
        <button onclick="fazerLogout()">Sair</button>
      </div>
    </div>
  </header>

  <!-- Banner de Instalação PWA -->
  <div id="pwa-install-banner" style="display:none; background:#ff4757; color:white; padding:10px; text-align:center;">
    <span>Deseja instalar nosso aplicativo no celular?</span>
    <button id="btn-install" style="background:white; color:#ff4757; border:none; padding:5px 10px; margin-left:10px; border-radius:4px; font-weight:bold;">Instalar</button>
  </div>

  <!-- Vitrine Aberta (Visível para todos sem login) -->
  <main>
    <h2>Produtos Disponíveis</h2>
    <div id="produtos-container">
      <!-- Exemplo de produto -->
      <div class="produto-card">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" alt="Burger">
        <h3>X-Burguer Especial</h3>
        <p>R$ 25,00</p>
        <button onclick="tentarAdicionarCarrinho()">Adicionar ao Carrinho</button>
      </div>
    </div>
  </main>

  <!-- Modal de Login / Cadastro -->
  <div id="auth-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span onclick="fecharModalLogin()" style="float:right; cursor:pointer;">&times;</span>
      <h2 id="modal-title">Entrar</h2>
      
      <input type="email" id="email" placeholder="E-mail"><br>
      <input type="password" id="senha" placeholder="Senha"><br>
      
      <button id="btn-acao-auth" onclick="realizarLogin()">Entrar</button>
      <p id="trocar-modo" onclick="alternarModoCadastro()">Não tem conta? Cadastre-se</p>
    </div>
  </div>

  <!-- Scripts do Firebase SDK (Modular) -->
  <script type="module" src="app.js"></script>
</body>
</html>
